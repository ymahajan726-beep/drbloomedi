services:
  postgres:
    image: postgres:16-alpine
    container_name: drbloomedi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drbloomedi
      POSTGRES_USER: drbloomedi_user
      POSTGRES_PASSWORD: drbloomedi_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: drbloomedi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: